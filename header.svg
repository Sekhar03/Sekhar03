<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto" style="border-radius: 12px; background: linear-gradient(135deg, #090d16 0%, #0d1527 50%, #1e1b4b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Decorative background elements -->
  <defs>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Background Circle -->
  <circle cx="700" cy="50" r="150" fill="url(#cyan-glow)" />
  
  <!-- Grid overlay mimicking technology/circuit board -->
  <path d="M 0,20 L 800,20 M 0,60 L 800,60 M 0,100 L 800,100 M 0,140 L 800,140 M 0,180 L 800,180" stroke="#1e293b" stroke-width="0.5" />
  <path d="M 100,0 L 100,220 M 200,0 L 200,220 M 300,0 L 300,220 M 400,0 L 400,220 M 500,0 L 500,220 M 600,0 L 600,220 M 700,0 L 700,220" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 4" />
  
  <!-- Circuit lines/accents -->
  <path d="M 50 110 L 120 110 L 150 140 L 250 140" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4" />
  <circle cx="50" cy="110" r="3" fill="#0ea5e9" opacity="0.8" />
  <circle cx="250" cy="140" r="3" fill="#0ea5e9" opacity="0.8" />

  <path d="M 750 110 L 680 110 L 650 80 L 550 80" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.4" />
  <circle cx="750" cy="110" r="3" fill="#d946ef" opacity="0.8" />
  <circle cx="550" cy="80" r="3" fill="#d946ef" opacity="0.8" />

  <!-- Name and title -->
  <text x="50%" y="85" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SEKHAR PARIDA</text>
  <text x="50%" y="125" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="2" filter="url(#glow)">PRODUCT ENGINEER & HARDWARE ARCHITECT</text>
  <text x="50%" y="160" font-size="12" fill="#94a3b8" text-anchor="middle" font-style="italic">Full-Stack Excellence • High-Performance Systems • Hardware-Software Co-Design</text>

  <!-- Bottom color bar -->
  <rect x="0" y="215" width="800" height="5" fill="url(#neon-line)" />
</svg>
